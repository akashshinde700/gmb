<?xml version="1.0" encoding="UTF-8"?>
<!--
  WebSetu mark. The "W" is drawn as a stroked path rather than text so the icon
  renders identically everywhere, including at 16px in a browser tab where no
  webfont is available.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WebSetu">
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#ws-bg)"/>
  <path
    d="M14 19 L23 45 L32 29 L41 45 L50 19"
    fill="none"
    stroke="#ffffff"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
